# .github/workflows/deploy-gate.yml — Post-deploy smoke-test invariant (Gate 13).
#
# v9.2.3 (Gate 13) — Post-deploy asset HTTP-200 gate.
#
# Why this exists: the 2026-08-01 SEV-1 prod-triage shipped a broken site
# because `npm run build` did not set BASE_PATH=/, so every asset + route
# was emitted as `/portfolio/...` and Cloudflare Pages served the HTML at
# root. Every CSS/JS/icon/font/manifest/internal link returned 404. The
# CI guardrail ran against the PR branch — but the DEPLOYED URL was the
# broken one. No post-deploy check traced the rendered HTML's asset paths
# back to actual HTTP responses.
#
# This workflow closes that gap. After the GitHub Pages deploy completes,
# this workflow loads the prod URL via Playwright Chromium, extracts every
# <link href>, <script src>, <img src>, and <source src>, fetches each
# one, and fails the workflow on any non-200.
#
# Strategy:
#   1. Trigger on `workflow_run` after the GH Pages deploy completes
#      (deploy.yml → "Build & Deploy to GitHub Pages").
#   2. Also trigger on `push: main` as a fast-feedback fallback.
#   3. Wait 60s after the upstream workflow to let GH Pages edge cache warm.
#   4. Install Playwright + chromium browser.
#   5. Run scripts/smoke-test-prod.mjs against PROD_URL.
#
# Single deploy surface (per [[portfolio-no-cf-mirror]] BINDING): the live
# URL is GitHub Pages. The pre-2026-08-08 Cloudflare Pages mirror trigger
# has been removed.
#
# Hard rules (per CLAUDE.md §1 + feedback-portfolio-visual-bar-2026-07-31):
#   - 5-must-have: terminal exit 0/1; idempotent re-run = same result;
#     dedupe key = `${route}::${asset}`; coverage = every local asset on
#     every page (not sampled); AAR = failures.json artifact.
#   - The local build hook (`scripts/smoke-test.mjs` + `npm run smoke:build`)
#     is the fast-feedback sibling; this GH Actions workflow is the
#     prod-deployment gate. Per Deming SoPK: the system invariant is "every
#     prod deploy's asset paths return 200" — enforced at 2 layers.

name: Deploy Gate (asset 200 sweep)

on:
  workflow_run:
    workflows:
      - 'Build & Deploy to GitHub Pages'
    types: [completed]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
    prod_url:
      description: 'Override prod URL (default: https://christianmacion26.github.io/portfolio/)'
      required: false
      default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asset-200-gate:
    name: Asset 200 gate (Playwright + node fetch)
    runs-on: ubuntu-latest
    # Triggered by workflow_run from upstream; only run if upstream succeeded.
    # For push: main + workflow_dispatch, always run.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for GitHub Pages edge cache warm
        if: github.event_name == 'workflow_run'
        run: sleep 60

      - name: Run prod smoke-test (asset 200 sweep)
        env:
          PROD_URL: ${{ github.event.inputs.prod_url || 'https://christianmacion26.github.io/portfolio' }}
        run: node scripts/smoke-test-prod.mjs

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: deploy-gate-failures
          path: .audit/incident/*-deploy-gate/
          retention-days: 30

      - name: Upload pass evidence
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: deploy-gate-pass
          path: .audit/incident/
          retention-days: 7
          if-no-files-found: ignore