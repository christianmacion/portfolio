# .github/workflows/hero-name-color-regression.yml — computed-color guard
# for the hero name on /. Hard-blocks ship if the hero-flagship__name H1
# renders with two-tone color or italic drift.
#
# Why this exists
# ---------------
# The hero on src/pages/index.astro:151 is a single
# `<h1 class="hero-flagship__name" data-words>Quantitative Researcher</h1>`.
# motion.ts (data-words handler at src/scripts/motion.ts:22) auto-wraps the
# inner text into `<span class="word">` spans for the per-word cascade.
# The contract: the H1 + all child word spans must render in the SAME
# computed color and SAME font-style (no italic-drift, no two-tone).
#
# Pre-v12.W4, the hero was a three-span `<h1 class="hero__name">` with
# `<em>` wrappers that forced italic + pulled --c-ink-2 from a cascade —
# a visible two-tone name. That bug shipped 4+ times in git history
# (7c190f3, 673dc72, 9a41ec8, 474f57a). The v12.W4/W5 rewrite ships a
# single text node wrapped by JS into .word spans; this workflow guards
# the same invariant against future regressions.
#
# Single deploy surface (per [[portfolio-no-cf-mirror]] BINDING): the live
# URL is GitHub Pages. The pre-2026-08-08 Cloudflare Pages mirror trigger
# has been removed.
#
# Test script: scripts/__tests__/hero-name-color-regression.mjs
# Default URL: https://christianmacion26.github.io/portfolio/
# Override:    workflow_dispatch input `prod_url`.
#
# Hard rules (per CLAUDE.md §1 + feedback-portfolio-visual-bar-2026-07-31):
#   - 5-must-have: terminal exit 0/1; idempotent re-run = same result;
#     dedupe key = `portfolio-hero-name-color-v2`; coverage = the hero H1
#     + every descendant node read; AAR = failures.json on FAIL.
#   - This is the post-deploy sibling of the local `npm run test:hero-name`
#     command. Both layers must be green to ship.

name: Hero name color regression

on:
  workflow_run:
    workflows:
      - 'Build & Deploy to GitHub Pages'
    types: [completed]
    branches: [main]
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      prod_url:
        description: 'Override prod URL (default: https://christianmacion26.github.io/portfolio/)'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: hero-name-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hero-name-color-gate:
    name: Hero name color guard (Playwright)
    runs-on: ubuntu-latest
    # Triggered by workflow_run from upstream; only run if upstream succeeded.
    # For push: main + pull_request + workflow_dispatch, always run.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for GitHub Pages edge cache warm
        if: github.event_name == 'workflow_run'
        run: sleep 60

      - name: Run hero name color regression test
        env:
          PROD_URL: ${{ github.event.inputs.prod_url || 'https://christianmacion26.github.io/portfolio/' }}
        run: node scripts/__tests__/hero-name-color-regression.mjs

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: hero-name-color-failures
          path: .audit/incident/*-hero-name-color/
          retention-days: 30

      - name: Upload pass evidence
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: hero-name-color-pass
          path: .audit/incident/
          retention-days: 7
          if-no-files-found: ignore