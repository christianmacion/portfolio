# .github/workflows/hero-name-color-regression.yml — computed-color guard
# for the hero name on /. Hard-blocks ship if the three .hero__name-{1,2,3}
# spans ever ship with different computed colors or italic drift.
#
# Why this exists
# ---------------
# The hero on src/pages/index.astro:115-118 is a single <h1 class="hero__name">
# with three spans: "Christian" / "T." / "Macion". The contract is that all
# three render in the SAME computed color and SAME font-style. The original
# bug wrapped "T." and "Macion" in <em> tags which forced italic and pulled
# --c-ink-2 from a cascade — a visible two-tone name.
#
# This regression has shipped 4+ times in git history:
#   - 7c190f3
#   - 673dc72
#   - 9a41ec8
#   - 474f57a  (the most recent re-fix)
#
# No CI guard previously read computed `color` / `font-style` on the three
# spans, so the bug slipped past the existing Lighthouse + visual-regression
# suite. This workflow closes that gap.
#
# Test script: scripts/__tests__/hero-name-color-regression.mjs
# Default URL: https://christianmacion-portfolio.pages.dev/ (production)
# Override:    workflow_dispatch input `prod_url` (for pre-prod / staging)
#
# Strategy:
#   1. Trigger on `workflow_run` after the Cloudflare Pages deploy completes
#      (mirrors the deploy-gate.yml pattern).
#   2. Also trigger on `push: main` as a fast-feedback fallback.
#   3. Wait 90s after the upstream workflow to let Cloudflare edge cache warm.
#   4. Install Playwright + chromium browser (reuses the same install step
#      as lighthouse.yml + deploy-gate.yml — no new infra).
#   5. Run scripts/__tests__/hero-name-color-regression.mjs against PROD_URL.
#
# Hard rules (per CLAUDE.md §1 + feedback-portfolio-visual-bar-2026-07-31):
#   - 5-must-have: terminal exit 0/1; idempotent re-run = same result;
#     dedupe key = `portfolio-hero-name-color-v1`; coverage = all 3 spans
#     read; AAR = .audit/incident/<date>-hero-name-color/failures.json.
#   - This is the post-deploy sibling of the local `npm run test:hero-name`
#     command. Both layers must be green to ship.

name: Hero name color regression

on:
  workflow_run:
    workflows:
      - 'cloudflare/pages-deploy'
      - 'Pages'
      - 'Deploy to Cloudflare Pages'
    types: [completed]
    branches: [main]
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      prod_url:
        description: 'Override prod URL (default: https://christianmacion-portfolio.pages.dev)'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: hero-name-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hero-name-color-gate:
    name: Hero name color guard (Playwright)
    runs-on: ubuntu-latest
    # Triggered by workflow_run from upstream; only run if upstream succeeded.
    # For push: main + pull_request + workflow_dispatch, always run.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for Cloudflare Pages edge cache warm
        if: github.event_name == 'workflow_run'
        run: sleep 90

      - name: Run hero name color regression test
        env:
          PROD_URL: ${{ github.event.inputs.prod_url || 'https://christianmacion-portfolio.pages.dev/' }}
        run: node scripts/__tests__/hero-name-color-regression.mjs

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: hero-name-color-failures
          path: .audit/incident/*-hero-name-color/
          retention-days: 30

      - name: Upload pass evidence
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: hero-name-color-pass
          path: .audit/incident/
          retention-days: 7
          if-no-files-found: ignore
