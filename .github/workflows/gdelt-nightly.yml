name: GDELT Nightly Refresh

# 2026-08-08 — keeps the EarthGlobe live-event feed fresh.
# Single deploy surface: GitHub Pages.
# Cron disabled by default; `workflow_dispatch` is always available for manual triggers.
#
# Every 4h on the off-hour (37 * * * * avoids the :00 thundering herd):
#   1. checkout + npm ci
#   2. run scripts/fetch-gdelt.mjs (writes src/data/gdelt-cache.json)
#   3. commit the refreshed cache (if changed)
#   4. GH Pages deploy picks up the new cache on the next push to main

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '37 */4 * * *'  # off-hour; Owner enables after confirming the schedule

permissions:
  contents: write

concurrency:
  group: gdelt-nightly
  cancel-in-progress: false

jobs:
  refresh-gdelt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest GDELT events
        run: npm run scripts:fetch-gdelt

      - name: Commit refreshed GDELT cache
        run: |
          if git diff --quiet src/data/gdelt-cache.json; then
            echo "::notice::No GDELT changes; skipping commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/data/gdelt-cache.json
            git commit -m "chore(gdelt): refresh event cache"
            git push
          fi
