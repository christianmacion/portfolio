# 2026-08-08 — local-dev only. CF Pages project `christianmacion-portfolio`
# has been deleted (per Owner directive). This file is consumed by
# `wrangler pages dev` for local Functions development only.
# No production deploy path reads this file.

name = "christianmacion-portfolio"
compatibility_date = "2026-07-31"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "portfolio-contact"
database_id = "7b04bef2-3eea-45b3-a2a5-ffa3b50ab1ec"

# 2026-08-08 — RATELIMIT KV also serves as the visitor-fingerprint store
# for /api/personality/who-am-i + /api/personality/track-visit (no new
# binding required; see AAR 2026-08-08-astro-hybrid-cloudflare.md §Decision).
[[kv_namespaces]]
binding = "RATELIMIT"
id = "94b15ec48d9644f99599655618fc7afd"
