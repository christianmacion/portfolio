<?xml version="1.0" encoding="UTF-8"?>
<!--
  cm-mark-amber-light.svg — CM monogram, light-background variant.
  Redesign 2026-07-24: fixes owner-reported "CM logo looks weird / unreadable".
  Prior mark jammed a left-opening sigmoid C against a shallow floating M
  chevron and layered decorative agent-graph nodes + an 8-tick "ticker"
  baseline on top — the clutter collapsed into an illegible blob at nav size.
  This mark drops all decoration: a clean geometric open-arc C and a full-height
  M, with a single deliberate amber chevron accent as the sole quant nod.
  Body ink = warm near-black (#1a1714) for light backgrounds; amber = site
  accent (#a88a3e, WCAG AA). NOTE: the live nav now inlines this geometry with
  currentColor so contrast always follows the theme; this file is a fallback.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CM — Christian Macion, Quantitative Researcher">
  <title>CM monogram</title>
  <desc>The initials C and M. Clean geometric forms in near-black with a single amber chevron accent on the M.</desc>
  <g fill="none" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 28 22 A 12 12 0 1 0 28 42" stroke="#1a1714"/>
    <polyline points="36,44 36,20" stroke="#1a1714"/>
    <polyline points="36,20 47,40 58,20" stroke="#a88a3e"/>
    <polyline points="58,20 58,44" stroke="#1a1714"/>
  </g>
</svg>
