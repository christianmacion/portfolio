<?xml version="1.0" encoding="UTF-8"?>
<!--
  cm-mark-amber-dark.svg — CM monogram, dark-background variant.
  Redesign 2026-07-24 (see cm-mark-amber-light.svg for rationale). Body ink =
  warm near-white (#d4cebd, the dark-theme ink token) so C/M read on the warm
  dark bg (#1a1714); amber chevron = site accent (#a88a3e, WCAG AA). NOTE: the
  live nav now inlines this geometry with currentColor; this file is a fallback.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CM — Christian Macion, Quantitative Researcher">
  <title>CM monogram</title>
  <desc>The initials C and M. Clean geometric forms in near-white with a single amber chevron accent on the M.</desc>
  <g fill="none" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 28 22 A 12 12 0 1 0 28 42" stroke="#d4cebd"/>
    <polyline points="36,44 36,20" stroke="#d4cebd"/>
    <polyline points="36,20 47,40 58,20" stroke="#a88a3e"/>
    <polyline points="58,20 58,44" stroke="#d4cebd"/>
  </g>
</svg>
