<?xml version="1.0" encoding="UTF-8"?>
<!--
  cm-mark.svg — Stratum CM monogram for Christian Macion (favicon + Safari mask-icon).
  v7.7.86 — institutional research desk register. Single serif "CM" letterforms
  in Source Serif 4 / Iowan Old Style / Charter / Georgia stack.

  The 1u amber hairline accent that ships on the live nav mark is DROPPED here
  because it rasterizes below 0.25 device pixels at 16px favicon size (illegible).
  The hairline belongs to the live nav; the favicon is the wordmark silhouette.

  Internal light/dark stylesheet — Safari pinned-tab + Chromium favicon both honor
  prefers-color-scheme. Cream ink on dark tab, near-black on light tab.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    :root {
      color: #1c2538;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color: #d4cebd;
      }
    }
  </style>
  <text
    x="32"
    y="42"
    font-family="'Source Serif 4', 'Iowan Old Style', 'Charter', Georgia, serif"
    font-size="40"
    font-weight="500"
    letter-spacing="-0.02em"
    text-anchor="middle"
    fill="currentColor"
  >CM</text>
</svg>
