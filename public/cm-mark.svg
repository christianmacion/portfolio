<?xml version="1.0" encoding="UTF-8"?>
<!--
  cm-mark.svg — CM monogram for Christian Macion (favicon + Safari mask-icon).
  Redesign 2026-07-24: monochrome via currentColor so it works as a favicon and
  a mask-icon on any tab-bar color. Clean geometric open-arc C + full-height M.
  Legible down to 16px. Replaces the prior sigmoid-C / Σ-M / agent-node /
  ticker-baseline mark whose decoration collapsed into noise at favicon size.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CM — Christian Macion, Quantitative Researcher">
  <title>CM monogram</title>
  <desc>The initials C and M in clean geometric strokes.</desc>
  <g fill="none" stroke="currentColor" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 28 22 A 12 12 0 1 0 28 42"/>
    <polyline points="36,44 36,20 47,40 58,20 58,44"/>
  </g>
</svg>
